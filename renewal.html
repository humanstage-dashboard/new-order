<script>
// ═══════════════════════════════════════
//  設定（変更が必要な場合はここだけ編集）
// ═══════════════════════════════════════
const CONFIG = {
  clientId: 'f7fbcd5a-fbb3-4ca6-8e78-c4f7df82bb4c',
  tenantId: '12196b8c-4c46-441c-8edc-12fd2c69d733',

  siteHost: 'humans.sharepoint.com',
  sitePath: '/sites/msteams_d48605',

  siteId:
  'humans.sharepoint.com,3535fafa-8772-40f5-8890-91558781da79,21fee808-6035-4845-ac63-b62263228e0b',

  listId:
  '7ef80114-c3a5-4800-9ce6-ff1d3336851c'
};

const PW       = '85200';
const MAKERS   = ['（未設定）','中野','中村','田村'];
const SENDERS  = ['（未設定）','竹之内','井上','清瀧'];
const STATUSES = ['依頼受付','支店チェック待ち','支店対応依頼中','作成完了','依頼キャンセル'];

let isEdit       = false;
let msalInstance = null;
let accessToken  = null;
let state        = [];
const today = new Date(); today.setHours(0,0,0,0);

// ═══════════════════════════════════════
//  Microsoft認証（MSAL）
// ═══════════════════════════════════════
async function initMsal() {
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId:    CONFIG.clientId,
      authority:   `https://login.microsoftonline.com/${CONFIG.tenantId}`,
      redirectUri: window.location.href.split('?')[0],
    },
    cache: { cacheLocation: 'sessionStorage' }
  });
  await msalInstance.initialize();
  const resp = await msalInstance.handleRedirectPromise();
  if (resp) { onSignedIn(resp); return; }
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const silent = await msalInstance.acquireTokenSilent({
        scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
        account: accounts[0]
      });
      onSignedIn(silent);
    } catch(e) {
      // サイレント失敗時はリダイレクトで再認証
      try {
        await msalInstance.acquireTokenRedirect({
          scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
          account: accounts[0]
        });
      } catch(e2) { /* ログインボタン表示のまま */ }
    }
  }
}

async function signIn() {
  try {
    await msalInstance.loginRedirect({
      scopes: ['Files.ReadWrite','Sites.ReadWrite.All']
    });
  } catch(e) { showError('ログインに失敗しました: ' + e.message); }
}

function signOut() {
  msalInstance.logoutRedirect();
  accessToken = null;
  document.getElementById('login-btn').style.display  = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('user-name').textContent    = '';
  document.getElementById('sync-btn').disabled        = true;
  document.getElementById('sync-status').textContent  = 'ログインしてデータを読み込んでください';
  state = [];
  document.getElementById('cards').innerHTML = '<div class="loading">Microsoftアカウントでログインしてデータを読み込んでください</div>';
  renderMetrics([]);
}

function onSignedIn(resp) {
  accessToken = resp.accessToken;
  const name  = resp.account?.name || resp.account?.username || '';
  document.getElementById('user-name').textContent    = name;
  document.getElementById('login-btn').style.display  = 'none';
  document.getElementById('logout-btn').style.display = '';
  document.getElementById('sync-btn').disabled        = false;
  loadData();
}

// ═══════════════════════════════════════
//  Graph API（SharePoint読み書き）
// ═══════════════════════════════════════
async function getSiteId() {
  const res = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const data = await res.json();
  return data.id;
}

async function loadData() {
  document.getElementById('sync-status').textContent = '読み込み中…';
  document.getElementById('sync-btn').disabled = true;
  document.getElementById('cards').innerHTML   = '<div class="loading">データを読み込んでいます…</div>';
  try {
    // トークンを毎回再取得（キャッシュされたトークンを避ける）
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      try {
        const freshToken = await msalInstance.acquireTokenSilent({
          scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
          account: accounts[0],
          forceRefresh: true
        });
        accessToken = freshToken.accessToken;
      } catch(e) { /* トークン更新失敗時は既存トークンを使用 */ }
    }
    // まずサイトIDを取得してからファイルにアクセス
    const siteRes = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!siteRes.ok) throw new Error(`サイト取得失敗 HTTP ${siteRes.status}: ${await siteRes.text()}`);
    const siteData = await siteRes.json();
    const siteId = siteData.id;

const listUrl =
`https://graph.microsoft.com/v1.0/sites/${CONFIG.siteId}/lists/${CONFIG.listId}/items?$expand=fields,lastModifiedByUser`;

const res = await fetch(listUrl, {
  headers: {
    Authorization: `Bearer ${accessToken}`
  }
});

if (!res.ok) {
  throw new Error(`HTTP ${res.status}`);
}

const data = await res.json();
    
console.log(
  "全件",
  JSON.stringify(data.value, null, 2)
);

let raw = data.value.map(item => ({

  Id: item.id,

  支店:
  item.fields["_x652f__x5e97_"],

  営業担当:
  item.fields["_x55b6__x696d__x62c5__x5f53_"],

  企業:
  item.fields["_x4f01__x696d_"],

  スタッフ:
  item.fields["_x30b9__x30bf__x30c3__x30d5_"],

  人数:
  item.fields["_x4eba__x6570_"],

  契約種別:
  item.fields["_x5951__x7d04__x7a2e__x5225_"],

  契約開始日:
(item.fields["_x5951__x7d04__x958b__x59cb__x65"] || '')
  .substring(0,10),

契約終了日:
(item.fields["_x5951__x7d04__x7d42__x4e86__x65"] || '')
  .substring(0,10),

  派遣元責任者:
  item.fields["_x6d3e__x9063__x5143__x8cac__x4e"],

  就労制限:
  item.fields["_x5c31__x52b4__x5236__x9650_"],

  内容の変更:
  item.fields["_x5185__x5bb9__x306e__x5909__x66"],
  
データシート格納:
item.fields["_x30c7__x30fc__x30bf__x30b7__x30"],

 巻き直し決裁取得済み:
item.fields["_x5dfb__x304d__x76f4__x3057__x6c"] || '',
  
  備考:
item.fields["Forms_x5099__x8003_"],

更新日時: (() => {
  const dt = item.fields["Modified"];
  if (!dt) return '';
  
  return new Date(dt).toLocaleString(
    'ja-JP',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit',
      hour12:false
    }
  );
})(),

更新者:
item.lastModifiedBy?.user?.displayName || '',
  
受付日時: (() => {
  const dt = item.fields["_x53d7__x4ed8__x65e5__x6642_"];
  if (!dt) return '';

  return new Date(dt).toLocaleString(
    'ja-JP',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit',

    "_x4f5c__x6210__x72b6__x6cc1_":

      item._maker,

    "_x6cd5__x52d9__x30e1__x30e2_":
      item._note,

    "_x4f01__x696d__x9001__x4ed8__x80":
      item._corp_sender,

      item._corp_date || null,

    "_x30b9__x30bf__x30c3__x30d5__x90":
      item._staff_sender,

    "_x30b9__x30bf__x30c3__x30d5__x900":
      item._staff_date || null
  };
  
  const res = await fetch(url,{
    method:'PATCH',
    headers:{

function parseDeadline(v) {
  if (!v || v === '') return null;
  const n = parseFloat(v);
  if (!isNaN(n) && n > 40000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    d.setHours(0,0,0,0); return d;
  }
  const parts = v.replace(/[年月\/\-]/g,' ').split(/\s+/).filter(Boolean);
  if (parts.length >= 3) {
    const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    d.setHours(0,0,0,0); return d;
  }
  return null;
}
function deadlineStatus(v) {
  // 更新契約書：契約開始日までの残り日数でアラート
  const d = parseDeadline(v); if (!d) return 'none';
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0)  return 'urgent';   // 開始日超過
  if (diff <= 3) return 'urgent';   // 3日以内
  if (diff <= 7) return 'soon3';    // 7日以内
  if (diff <= 14) return 'soon7';   // 14日以内
  return 'normal';
}
function deadlineLabel(v, status) {
  // 更新契約書：契約開始日までの残り日数
  const d = parseDeadline(v); if (!d) return { cls: 'dl-none', text: '開始日未定', sub: null };
  const ds = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  if (status === '作成完了' || status === '依頼キャンセル') return { cls: 'dl-normal', text: ds, sub: null };
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0)   return { cls: 'dl-urgent', text: ds, sub: `開始日${Math.abs(diff)}日超過` };
  if (diff === 0) return { cls: 'dl-urgent', text: ds, sub: '本日開始' };
  if (diff <= 3)  return { cls: 'dl-urgent', text: ds, sub: `開始まで${diff}日` };
  if (diff <= 7)  return { cls: 'dl-soon3',  text: ds, sub: `開始まで${diff}日` };
  if (diff <= 14) return { cls: 'dl-soon7',  text: ds, sub: `開始まで${diff}日` };
  return { cls: 'dl-normal', text: ds, sub: null };
}
function cardBorderClass(v, status) {
  if (status === '作成完了' || status === '依頼キャンセル') return '';
  const s = deadlineStatus(v);
  if (s === 'urgent') return 'deadline-urgent';  // 1日以内＋期限切れ
  if (s === 'soon3')  return 'deadline-soon3';   // 3日以内
  if (s === 'soon7')  return 'deadline-soon7';   // 7日以内
  return '';
}
function statusBadgeClass(s) {
  if (!s || s === '依頼受付')  return 'badge-pending';
  if (s === '作成完了')         return 'badge-done';
  if (s === '支店チェック待ち' || s === '支店対応依頼中') return 'badge-check';
  if (s === '依頼キャンセル')   return 'badge-cancel';
  return 'badge-pending';
}
function kindBadgeClass(k) { return k && k.includes('巻き直し') ? 'badge-replace' : 'badge-new'; }

function getFiltered() {
  const q          = document.getElementById('search').value.toLowerCase();
  const branch     = document.getElementById('filterBranch').value;
  const tanto      = document.getElementById('filterTanto').value;
  const kind       = document.getElementById('filterKind').value;
  const status     = document.getElementById('filterStatus').value;
  const dl         = document.getElementById('filterDeadline').value;
  const dateFrom = document.getElementById('filterDateFrom')?.value || '';
  const dateTo   = document.getElementById('filterDateTo')?.value || '';
  const sort       = document.getElementById('sortOrder')?.value || 'new';

  let filtered = state.filter(d => {
    if (q && !d.企業?.toLowerCase().includes(q) && !d._staffName.toLowerCase().includes(q)) return false;
    if (branch && d.支店      !== branch) return false;
    if (tanto  && d.営業担当  !== tanto)  return false;
    if (kind   && !d.契約種別?.includes(kind)) return false;
    if (status && d._status   !== status) return false;
    if (dl) {
      const s = deadlineStatus(d.契約開始日);
      if (dl === 'urgent' && s !== 'urgent')  return false;
      if (dl === 'soon3'  && s !== 'soon3')   return false;
      if (dl === 'soon7'  && s !== 'soon7')   return false;
    }
    // 期間指定フィルター
    // dateFrom指定あり：契約開始日がdateFrom以降
    if (dateFrom && d.契約開始日 && d.契約開始日 < dateFrom) return false;
    // dateTo指定あり：契約開始日がdateTo以前
    if (dateTo && d.契約開始日 && d.契約開始日 > dateTo) return false;
    // dateFromのみ：開始日以降の契約を全表示（契約開始日がない場合は除外しない）
    // dateToのみ：終了日以前の契約を全表示（契約開始日がない場合は除外しない）
    return true;
  });

  const STATUS_ORDER = ['依頼受付','支店チェック待ち','支店対応依頼中','作成完了','依頼キャンセル'];
  filtered.sort((a, b) => {
    switch (sort) {
      case 'new':
　　　　 return new Date(b.受付日時) - new Date(a.受付日時);
      case 'old':
        return (parseFloat(a.Id) || 0) - (parseFloat(b.Id) || 0);
      case 'deadline_asc': {
        // 作成完了・依頼キャンセルは末尾
        const aDone = (a._status === '作成完了' || a._status === '依頼キャンセル') ? 1 : 0;
        const bDone = (b._status === '作成完了' || b._status === '依頼キャンセル') ? 1 : 0;
        if (aDone !== bDone) return aDone - bDone;
        const da = parseDeadline(a.契約開始日), db = parseDeadline(b.契約開始日);
        if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
        return da - db;
      }
      case 'deadline_desc': {
        const aDone2 = (a._status === '作成完了' || a._status === '依頼キャンセル') ? 1 : 0;
        const bDone2 = (b._status === '作成完了' || b._status === '依頼キャンセル') ? 1 : 0;
        if (aDone2 !== bDone2) return aDone2 - bDone2;
        const da = parseDeadline(a.契約開始日), db = parseDeadline(b.契約開始日);
        if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
        return db - da;
      }
      case 'branch':
        return (a.企業||'').localeCompare(b.企業||'', 'ja');
      default:
        return 0;
    }
  });

  return filtered;
}

  // 開始まで3日以内・超過（作成未完了のみ）
  const critical = data.filter(d => {
    const s = deadlineStatus(d.契約開始日);
    const notDone = d._status !== '作成完了' && d._status !== '依頼キャンセル';
    return notDone && s === 'urgent';
  }).length;
  // 開始まで7日以内（作成未完了のみ）
  const soon3 = data.filter(d => {

    const notDone = d._status !== '作成完了' && d._status !== '依頼キャンセル';
    return notDone && s === 'soon3';
  }).length;
  document.getElementById('metrics').innerHTML = `

}

async function saveCard(uid) {
  if (!isEdit) return;
  const item = state.find(d => d._uid === uid); if (!item) return;
  item._status       = document.getElementById('status-'+uid).value;
  item._maker        = document.getElementById('maker-'+uid).value;
  item._note         = document.getElementById('note-'+uid).value;
  item._corp_sender  = document.getElementById('csender-'+uid).value;
  item._corp_date    = document.getElementById('cdate-'+uid).value;
  item._staff_sender = document.getElementById('ssender-'+uid).value;
  item._staff_date   = document.getElementById('sdate-'+uid).value;

  // ステータスバッジを更新
  const badge = document.getElementById('sbadge-'+uid);
  if (badge) { badge.className = 'badge '+statusBadgeClass(item._status); badge.textContent = item._status; }

  // カードの左ボーダー色を更新（作成完了はボーダーなし）
  const card = document.getElementById('card-'+uid);
  if (card) {
    card.classList.remove('deadline-urgent','deadline-soon3','deadline-soon7');
    if (item._status !== '作成完了' && item._status !== '依頼キャンセル') {
      const bc = cardBorderClass(item.契約開始日, item._status);
      if (bc) card.classList.add(bc);
    }
  }
  
  // 期限ラベルの色も更新（作成完了は通常色に）
  const dlEl = card?.querySelector('.dl-over, .dl-urgent, .dl-soon, .dl-normal, .dl-none');
  if (dlEl && (item._status === '作成完了' || item._status === '依頼キャンセル')) {
    const dl = deadlineLabel(item.契約開始日, item._status);
    dlEl.className = 'dl-normal';
  }

  try {
  await saveData(item);

  const msg = document.getElementById('saved-'+uid);
  if (msg) {
    msg.style.display = 'inline';
  }

  // SharePointから再取得
  await loadData();

} catch(e) {
  showError('保存に失敗しました: ' + e.message);
}

  // メトリクスのみ更新（カード全体の再描画はしない→複製防止）
  renderMetrics(getFiltered());
}

function setTodayIfEmpty(dateId, value){

console.log('動いた', dateId, value);
  
  if(!value || value === '（未設定）'){
    return;
  }

  const el =
    document.getElementById(dateId);

  if(!el){
    return;
  }

  if(el.value){
    return;
  }

  const today =
    new Date()
      .toISOString()
      .split('T')[0];

  el.value = today;
}
